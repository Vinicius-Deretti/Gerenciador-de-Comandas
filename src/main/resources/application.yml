spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: comandas-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/comandas}
    username: ${DB_USERNAME:comandas}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${SERVER_PORT:8081}
estabelecimento:
  fuso: ${ESTABELECIMENTO_FUSO:America/Sao_Paulo}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

